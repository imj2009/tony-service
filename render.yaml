# Render 部署配置
services:
  - type: web
    name: tony-service
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3000"
      - key: SMTP_FROM
        value: "tonywallect <noreply@tonywallect.dpdns.org>"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DAILY_SEND_LIMIT
        value: "100"
      - key: DAILY_TRACK_LIMIT
        value: "5000"
      # 以下两项敏感值，在 Render Dashboard 部署后手动填，不写进仓库
      - key: SMTP_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
